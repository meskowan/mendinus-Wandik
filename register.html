<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar — APLANNYMW</title><link rel="icon" href="assets/logo-aplannymw.svg"><link rel="stylesheet" href="style.css"><style>.auth-wrap{max-width:480px;margin:8vh auto;padding:24px}.auth-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px}.auth-box h1{font-size:32px;letter-spacing:-1px}.auth-box label{display:block;font-size:12px;margin:16px 0 7px}.auth-box .button{width:100%;margin-top:20px}.auth-link{color:var(--cyan);font-size:12px}.auth-logo{width:46px}</style></head><body><main class="auth-wrap"><div class="auth-box"><img class="auth-logo" src="assets/logo-aplannymw.svg"><p class="eyebrow">BUAT AKUN BARU</p><h1>Gabung APLANNYMW.</h1><p class="muted">Daftar untuk memiliki dashboard pribadi.</p><form id="register-form"><label>Nama lengkap</label><input id="full_name" required maxlength="80" autocomplete="name"><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password (minimal 8 karakter)</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><button class="button primary" type="submit">Buat akun →</button></form><p id="message" class="status" role="status"></p><p class="muted">Sudah punya akun? <a class="auth-link" href="login.html">Login</a></p><a class="auth-link" href="index.html">← Kembali ke website</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth-client.js"></script><script>document.getElementById('register-form').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message');showMessage(m,'Membuat akun...');const {data,error}=await supabaseClient.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:full_name.value}}});if(error)return showMessage(m,error.message,true);showMessage(m,data.session?'Akun berhasil dibuat. Mengalihkan...':'Pendaftaran berhasil. Periksa email untuk verifikasi, lalu login.');if(data.session)setTimeout(()=>location.href='dashboard.html',900);});</script></body></html>
