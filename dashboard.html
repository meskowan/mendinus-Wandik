<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard User — APLANNYMW</title><link rel="icon" href="assets/logo-aplannymw.svg"><link rel="stylesheet" href="style.css"><style>.dash{max-width:900px;margin:50px auto;padding:24px}.dash-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;margin:20px 0}.dash h1{font-size:38px;letter-spacing:-1px}.dash-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.profile-form label{display:block;font-size:12px;margin:14px 0 6px}.profile-form button{margin-top:18px}</style></head><body><main class="dash"><a class="brand" href="index.html"><img class="brand-logo" src="assets/logo-aplannymw.svg">aplanny<span class="accent">mw</span></a><div class="dash-card"><p class="eyebrow">USER DASHBOARD</p><h1>Halo, <span class="gradient-text" id="name">pengguna</span>.</h1><p class="muted">Selamat datang di ruang akun APLANNYMW.</p><p id="email" class="muted"></p></div><div class="dash-card"><h2>Profil saya</h2><form id="profile-form" class="profile-form"><label>Nama tampilan</label><input id="display_name" maxlength="80" required><button class="button primary" type="submit">Simpan profil</button></form><p id="status" class="status"></p></div><div class="dash-card"><h2>Akses cepat</h2><p class="muted">Lihat portofolio publik atau kembali ke beranda.</p><div class="dash-actions"><a class="button secondary" href="index.html#projects">Lihat portofolio</a><a class="button secondary" id="admin-link" href="admin.html" hidden>Dashboard admin</a><button class="button primary" id="logout">Logout</button></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth-client.js"></script><script>let current; (async()=>{try{current=await getMyProfile();if(!current)return;const n=current.profile.full_name||current.user.user_metadata?.full_name||'Pengguna';document.getElementById('name').textContent=n;document.getElementById('email').textContent=current.user.email;document.getElementById('display_name').value=n;if(current.profile.role==='admin')document.getElementById('admin-link').hidden=false;}catch(e){showMessage(document.getElementById('status'),e.message,true);}})();document.getElementById('profile-form').addEventListener('submit',async e=>{e.preventDefault();const v=document.getElementById('display_name').value.trim();const {error}=await supabaseClient.from('profiles').update({full_name:v}).eq('id',current.user.id);showMessage(document.getElementById('status'),error?error.message:'Profil berhasil disimpan.',!!error);if(!error)document.getElementById('name').textContent=v;});document.getElementById('logout').onclick=async()=>{await supabaseClient.auth.signOut();location.href='index.html';};</script></body></html>
